      display: inline-flex;

    /**********************
     * STOCKAGE LOCAL (multi-utilisateurs)
     *********************/

    const STORAGE_KEY_USER = "qcm_multi_user_v1";
    const STORAGE_KEY_HISTORY = "qcm_history_v1";

    function saveLocal(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }
    function loadLocal(key, defaultValue) {
      const raw = localStorage.getItem(key);
      if (!raw) return defaultValue;
      try { return JSON.parse(raw); } catch { return defaultValue; }
    }

    const app = document.getElementById("app");

    function render() {
      const currentUser = loadLocal(STORAGE_KEY_USER, null);
      if (!currentUser) {
        renderLogin();
      } else {
        renderMain(currentUser);
      }
    }

    /**********************
     * LOGIN MULTI-UTILISATEUR
     *********************/

    function renderLogin() {
      app.innerHTML = "";
      const container = document.createElement("div");
      container.className = "login-container card";

      const history = loadLocal(STORAGE_KEY_HISTORY, []);
      const userSet = new Set(history.map(h => h.user));
      const userList = Array.from(userSet);
      let lastUser = null;
      if (history.length > 0) lastUser = history[history.length - 1].user;

      container.innerHTML = `
        <div class="login-title">QCM Médicaux – Epreuves</div>
        <div class="login-sub">
          Mode épreuve (20 QCM) par chapitre ou matière.<br/>
          Multi-utilisateurs, classement et rang par matière.
        </div>
        <div class="mt-16">
          <label for="login-name">Nom / Pseudo</label>
          <input id="login-name" type="text" placeholder="Ex : Nes, Léo, Co-D1..." />
        </div>
        ${userList.length ? `
        <div class="mt-12">
          <div class="text-muted">Utilisateurs récents :</div>
          <div class="mt-4 flex">
            ${userList.map(u => `
              <button type="button" class="secondary" data-user="${u}">
                ${u === lastUser ? "⭐ " : ""}${u}
              </button>
            `).join("")}
          </div>
        </div>` : ""}
        <div class="mt-16">
          <button id="login-btn"><span>Entrer</span></button>
        </div>
      `;

      app.appendChild(container);

      const input = container.querySelector("#login-name");
      const btn = container.querySelector("#login-btn");
      const existingBtns = container.querySelectorAll("button.secondary[data-user]");

      btn.addEventListener("click", () => {
        const name = (input.value || "").trim();
        if (!name) {
          alert("Entre au moins un prénom ou un pseudo 🙂");
          return;
        }
        saveLocal(STORAGE_KEY_USER, { name });
        render();
      });

      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") btn.click();
      });

      existingBtns.forEach(b => {
        b.addEventListener("click", () => {
          const user = b.getAttribute("data-user");
          saveLocal(STORAGE_KEY_USER, { name: user });
          render();
        });
      });
    }

    /**********************
     * VUE PRINCIPALE
     *********************/

    function renderMain(user) {
      app.innerHTML = "";

      // HEADER
      const headerCard = document.createElement("div");
      headerCard.className = "card";
      headerCard.innerHTML = `
        <div class="card-header">
          <div>
            <h1>Bonjour, ${user.name} 👋</h1>
            <div class="text-muted">
              Mode épreuve (20 QCM) avec dossiers par matière et chapitres.<br/>
              Scores séparés par utilisateur, comparaison et rang (Fer → Élite global).
            </div>
          </div>
          <div class="flex">
            <span class="badge">Bêta exam-style</span>
            <button class="secondary" id="logout-btn">Changer d’utilisateur</button>
          </div>
        </div>
      `;
      app.appendChild(headerCard);
      headerCard.querySelector("#logout-btn").addEventListener("click", () => {
        saveLocal(STORAGE_KEY_USER, null);
        render();
      });

      // Sélecteurs matière / chapitre / mode
      const selectorCard = document.createElement("div");
      selectorCard.className = "card";

      const matieres = Object.keys(QCM_DATA);
      const defaultMatiere = matieres[0];
      const chapitres = Object.keys(QCM_DATA[defaultMatiere]);
      const defaultChapitre = chapitres[0];

      selectorCard.innerHTML = `
        <div class="card-header">
          <div>
            <h2>Paramètres de l’épreuve</h2>
            <div class="text-muted">
              Choisis la matière, le chapitre ou une épreuve mélangeant les chapitres d’une même matière.
            </div>
          </div>
          <div class="flex">
            <span class="badge">Mode EDN</span>
          </div>
        </div>
        <div class="mt-8">
          <label for="select-matiere">Matière</label>
          <select id="select-matiere"></select>
        </div>
        <div class="mt-8">
          <label for="select-chapitre">Chapitre</label>
          <select id="select-chapitre"></select>
        </div>
        <div class="mt-8 flex">
          <div id="mode-chapitre" class="mode-pill active" data-mode="chapitre">Mode chapitre (20 QCM du chapitre)</div>
          <div id="mode-matiere" class="mode-pill" data-mode="matiere">Mode épreuve matière (chapitres mélangés)</div>
        </div>
        <div class="mt-12 flex space-between">
          <div style="flex:1; max-width: 180px;">
            <label for="nb-qcm">Nombre de QCM</label>
            <input type="number" id="nb-qcm" min="1" max="50" value="20" />
          </div>
          <div class="mt-8">
            <span class="pill" id="infos-qcm"></span>
          </div>
        </div>
        <div class="mt-16 flex space-between">
          <button id="btn-start">Lancer l’épreuve</button>
          <button class="secondary" id="btn-clear-user">Réinitialiser mes scores</button>
        </div>
      `;
      app.appendChild(selectorCard);

      const selectMatiere = selectorCard.querySelector("#select-matiere");
      const selectChapitre = selectorCard.querySelector("#select-chapitre");
      const modeChapitrePill = selectorCard.querySelector("#mode-chapitre");
      const modeMatierePill = selectorCard.querySelector("#mode-matiere");
      const nbQcmInput = selectorCard.querySelector("#nb-qcm");
      const infosQcmSpan = selectorCard.querySelector("#infos-qcm");
      const btnStart = selectorCard.querySelector("#btn-start");
      const btnClearUser = selectorCard.querySelector("#btn-clear-user");

      matieres.forEach((m) => {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = m;
        selectMatiere.appendChild(opt);
      });
      selectMatiere.value = defaultMatiere;

      function updateChapitres() {
        selectChapitre.innerHTML = "";
        const matiere = selectMatiere.value;
        const chapList = Object.keys(QCM_DATA[matiere]);
        chapList.forEach((c) => {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          selectChapitre.appendChild(opt);
        });
        selectChapitre.value = chapList[0];
      }

      updateChapitres();

      let currentMode = "chapitre"; // ou "matiere"

      function updateMode(mode) {
        currentMode = mode;
        if (mode === "chapitre") {
          modeChapitrePill.classList.add("active");
          modeMatierePill.classList.remove("active");
        } else {
          modeChapitrePill.classList.remove("active");
          modeMatierePill.classList.add("active");
        }
        updateInfoQcm();
      }

      function getAvailableQuestions() {
        const matiere = selectMatiere.value;
        const chapitre = selectChapitre.value;
        if (currentMode === "chapitre") {
          return QCM_DATA[matiere][chapitre] || [];
        } else {
          const all = [];
          const chapMap = QCM_DATA[matiere];
          Object.keys(chapMap).forEach(ch => {
            all.push(...chapMap[ch]);
          });
          return all;
        }
      }

      function updateInfoQcm() {
        const questions = getAvailableQuestions();
        const n = questions.length;
        const bar = "Barème : 0 faute = 1 ; 1 faute = 0,5 ; 2 fautes = 0,2 ; ≥3 fautes = 0";
        infosQcmSpan.textContent = `${n} QCM dispo · ${bar}`;
      }

      modeChapitrePill.addEventListener("click", () => updateMode("chapitre"));
      modeMatierePill.addEventListener("click", () => updateMode("matiere"));

      selectMatiere.addEventListener("change", () => {
        updateChapitres();
        updateInfoQcm();
      });
      selectChapitre.addEventListener("change", updateInfoQcm);
      nbQcmInput.addEventListener("change", () => {
        const v = parseInt(nbQcmInput.value || "20", 10);
        if (v < 1) nbQcmInput.value = 1;
      });

      btnClearUser.addEventListener("click", () => {
        if (!confirm("Effacer tout ton historique pour ce compte ?")) return;
        const history = loadLocal(STORAGE_KEY_HISTORY, []);
        const filtered = history.filter(h => h.user !== user.name);
        saveLocal(STORAGE_KEY_HISTORY, filtered);
        alert("Historique effacé pour " + user.name);
        render();
      });

      // Cartes épreuve + historique + classement
      const examCard = document.createElement("div");
      examCard.className = "card";
      examCard.id = "exam-card";
      app.appendChild(examCard);

      const historyCard = document.createElement("div");
      historyCard.className = "card";
      historyCard.id = "history-card";
      app.appendChild(historyCard);

      const leaderboardCard = document.createElement("div");
      leaderboardCard.className = "card";
      leaderboardCard.id = "leaderboard-card";
      app.appendChild(leaderboardCard);

      btnStart.addEventListener("click", () => {
        const questionsPool = getAvailableQuestions();
        if (!questionsPool.length) {
          alert("Pas encore de QCM dans ce dossier (matière/chapitre).");
          return;
        }
        const nRequested = parseInt(nbQcmInput.value || "20", 10);
        const questions = pickRandomQuestions(questionsPool, nRequested);
        renderExam(user, questions, {
          matiere: selectMatiere.value,
          chapitre: selectChapitre.value,
          mode: currentMode
        }, examCard, historyCard, leaderboardCard);
      });

      updateInfoQcm();
      renderHistory(user, historyCard);
      renderLeaderboard(user, leaderboardCard);
    }

    /**********************
     * UTILITAIRES
     *********************/

    function pickRandomQuestions(pool, n) {
      const arr = [...pool];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr.slice(0, Math.min(n, arr.length));
    }

    // Barème :
    // 0 faute -> 1
    // 1 faute -> 0,5
    // 2 fautes -> 0,2
    // ≥3 fautes -> 0
    function gradeQuestion(question, selected) {
      const correct = question.correct;
      const correctSet = new Set(correct);
      const selectedSet = new Set(selected);

      let errors = 0;
      selectedSet.forEach(letter => {
        if (!correctSet.has(letter)) errors++;
      });
      correctSet.forEach(letter => {
        if (!selectedSet.has(letter)) errors++;
      });

      let score = 0;
      if (errors === 0) score = 1;
      else if (errors === 1) score = 0.5;
      else if (errors === 2) score = 0.2;
      else score = 0;

      let comment = "";
      if (errors === 0) comment = "✅ Parfait, aucune erreur sur cette question.";
      else if (errors === 1) comment = "🟡 Une seule erreur : presque parfait, mais à revoir rapidement.";
      else if (errors === 2) comment = "🟠 Deux erreurs : notion fragile, à retravailler.";
      else comment = "🔴 Trois erreurs ou plus : revoir le cours sur ce point.";

      return { score, errorsCount: errors, comment };
    }

    // Rangs en fonction du pourcentage moyen
    function getRankLabel(percent) {
      if (percent < 30) return "Fer";
      if (percent < 50) return "Bronze";
      if (percent < 65) return "Or";
      if (percent < 75) return "Cristal";
      if (percent < 85) return "Platine";
      if (percent < 93) return "Champion";
      if (percent < 98) return "Grand champion";
      return "Élite global";
    }

    /**********************
     * RENDU ÉPREUVE
     *********************/

    function renderExam(user, questions, meta, examCard, historyCard, leaderboardCard) {
      examCard.innerHTML = `
        <div class="card-header">
          <div>
            <h2>Epreuve – ${meta.mode === "chapitre" ? meta.chapitre : meta.matiere}</h2>
            <div class="text-muted">
              Mode : ${meta.mode === "chapitre" ? "Chapitre" : "Matière (chapitres mélangés)"} · ${questions.length} QCM
            </div>
          </div>
          <div class="flex">
            <span class="badge">En cours</span>
          </div>
        </div>
      `;

      const form = document.createElement("div");
      form.id = "exam-form";

      questions.forEach((q, index) => {
        const qId = q.id;
        const qTheme = q.theme || "";
        const qChapter = q.chapter || meta.chapitre;

        const qDiv = document.createElement("div");
        qDiv.className = "qcm-question";
        qDiv.dataset.qid = qId;

        let optionsHtml = "";
        for (const [letter, text] of Object.entries(q.options)) {
          optionsHtml += `
            <label>
              <input type="checkbox" name="${qId}" value="${letter}" />
              <span><strong>${letter}.</strong> ${text}</span>
            </label>
          `;
        }

        qDiv.innerHTML = `
          <div class="flex space-between">
            <div class="qcm-title">${index + 1}. ${q.question}</div>
            <div class="chip-score" id="score-${qId}">– / 1</div>
          </div>
          <div class="text-muted">Matière : ${meta.matiere} · Chapitre : ${qChapter} · Thème : ${qTheme}</div>
          <div class="qcm-options mt-8">
            ${optionsHtml}
          </div>
          <div class="text-muted mt-8" id="feedback-${qId}"></div>
        `;
        form.appendChild(qDiv);
      });

      const actionsDiv = document.createElement("div");
      actionsDiv.className = "mt-16 flex space-between";
      actionsDiv.innerHTML = `
        <button id="btn-corriger">Corriger l’épreuve</button>
        <button class="secondary" id="btn-reset">Effacer toutes les réponses</button>
      `;

      examCard.appendChild(form);
      examCard.appendChild(actionsDiv);

      const btnCorriger = examCard.querySelector("#btn-corriger");
      const btnReset = examCard.querySelector("#btn-reset");

      btnCorriger.addEventListener("click", () => {
        corrigerEpreuve(user, questions, meta, examCard, historyCard, leaderboardCard);
      });

      btnReset.addEventListener("click", () => {
        const checkboxes = examCard.querySelectorAll("input[type='checkbox']");
        checkboxes.forEach(cb => cb.checked = false);
        questions.forEach(q => {
          const scoreChip = document.getElementById(`score-${q.id}`);
          const feedback = document.getElementById(`feedback-${q.id}`);
          if (scoreChip) {
            scoreChip.textContent = "– / 1";
            scoreChip.className = "chip-score";
          }
          if (feedback) feedback.textContent = "";
        });
      });
    }

    function corrigerEpreuve(user, questions, meta, examCard, historyCard, leaderboardCard) {
      let totalScore = 0;
      const totalMax = questions.length;
      const perQuestion = [];

      questions.forEach(q => {
        const qId = q.id;
        const qTheme = q.theme || "";
        const qChapter = q.chapter || meta.chapitre;
        const qAdvice = q.advice || "";

        const checkboxes = examCard.querySelectorAll(`input[name='${qId}']:checked`);
        const selected = Array.from(checkboxes).map(cb => cb.value);
        const { score, errorsCount, comment } = gradeQuestion(q, selected);

        totalScore += score;
        perQuestion.push({
          id: qId,
          question: q.question,
          score,
          errorsCount,
          theme: qTheme,
          chapter: qChapter,
          advice: qAdvice
        });

        const scoreChip = document.getElementById(`score-${qId}`);
        const feedback = document.getElementById(`feedback-${qId}`);
        if (scoreChip) {
          scoreChip.textContent = `${score.toFixed(1)} / 1`;
          scoreChip.className = "chip-score " + (
            score === 1 ? "full" :
            score === 0.5 ? "almost" :
            score === 0.2 ? "low" : "zero"
          );
        }
        if (feedback) {
          feedback.innerHTML = `
            ${comment}<br/>
            <span class="text-muted">Correction attendue : ${q.correct.join(", ")}</span>
          `;
        }
      });

      const percent = totalMax ? (100 * totalScore / totalMax) : 0;

      // Sauvegarde historique
      const history = loadLocal(STORAGE_KEY_HISTORY, []);
      history.push({
        user: user.name,
        date: new Date().toISOString(),
        matiere: meta.matiere,
        chapitre: meta.mode === "chapitre" ? meta.chapitre : "Epreuve matière",
        mode: meta.mode,
        totalScore,
        totalMax,
        percent: Math.round(percent),
        perQuestion
      });
      saveLocal(STORAGE_KEY_HISTORY, history);

      renderResultCard(meta, totalScore, totalMax, percent, perQuestion, examCard);
      renderHistory(user, historyCard);
      renderLeaderboard(user, leaderboardCard);
    }

    function renderResultCard(meta, totalScore, totalMax, percent, perQuestion, examCard) {
      let existing = document.getElementById("result-card");
      if (!existing) {
        existing = document.createElement("div");
        existing.id = "result-card";
        existing.className = "card mt-16";
        examCard.parentNode.insertBefore(existing, examCard.nextSibling);
      }

      const toReview = perQuestion.filter(q => q.score < 1);
      const themes = new Map();
      toReview.forEach(q => {
        if (!themes.has(q.theme)) {
          themes.set(q.theme, q.advice || q.theme);
        }
      });

      let adviceHtml = "";
      if (toReview.length === 0) {
        adviceHtml = `<p class="text-muted">Rien de particulier à revoir sur cette épreuve, c’est propre 👌</p>`;
      } else {
        adviceHtml = `<ul class="advice-list">`;
        themes.forEach((text, theme) => {
          adviceHtml += `<li><strong>${theme} :</strong> ${text}</li>`;
        });
        adviceHtml += `</ul>`;
      }

      existing.innerHTML = `
        <div class="card-header">
          <div>
            <h2>Résultats – ${meta.mode === "chapitre" ? meta.chapitre : meta.matiere}</h2>
            <div class="text-muted">
              Mode : ${meta.mode === "chapitre" ? "Chapitre" : "Matière (chapitres mélangés)"}
            </div>
          </div>
          <div class="result-main">
            ${totalScore.toFixed(1)} / ${totalMax} (${percent.toFixed(0)}%)
          </div>
        </div>
        <div class="mt-8">
          <div class="progress-bar">
            <div class="progress-bar-inner" style="width:${percent}%;"></div>
          </div>
        </div>
        <div class="mt-12">
          <div class="text-muted">Conseils de révision ciblée :</div>
          ${adviceHtml}
        </div>
      `;
    }

    /**********************
     * HISTORIQUE
     *********************/

    function renderHistory(user, historyCard) {
      const history = loadLocal(STORAGE_KEY_HISTORY, []);
      const userHistory = history.filter(h => h.user === user.name);

      historyCard.innerHTML = `
        <div class="card-header">
          <div>
            <h2>Historique de tes épreuves</h2>
            <div class="text-muted">Scores uniquement pour ${user.name}.</div>
          </div>
        </div>
      `;

      if (userHistory.length === 0) {
        const p = document.createElement("p");
        p.className = "text-muted mt-8";
        p.textContent = "Aucune épreuve enregistrée pour l’instant.";
        historyCard.appendChild(p);
        return;
      }

      userHistory.sort((a, b) => new Date(b.date) - new Date(a.date));

      const table = document.createElement("table");
      table.innerHTML = `
        <thead>
          <tr>
            <th>Date</th>
            <th>Matière</th>
            <th>Chapitre / Mode</th>
            <th>Score</th>
            <th>%</th>
            <th>Q à revoir</th>
          </tr>
        </thead>
        <tbody>
          ${userHistory.map(h => {
            const dateObj = new Date(h.date);
            const labelDate = dateObj.toLocaleString("fr-FR", {
              day: "2-digit",
              month: "2-digit",
              hour: "2-digit",
              minute: "2-digit"
            });
            const toReview = h.perQuestion.filter(q => q.score < 1).length;
            return `
              <tr>
                <td>${labelDate}</td>
                <td>${h.matiere}</td>
                <td>${h.chapitre}</td>
                <td>${h.totalScore.toFixed(1)} / ${h.totalMax}</td>
                <td>${h.percent}%</td>
                <td>${toReview}</td>
              </tr>
            `;
          }).join("")}
        </tbody>
      `;
      historyCard.appendChild(table);
    }

    /**********************
     * CLASSEMENT & COMPARAISON
     *********************/

    function renderLeaderboard(user, leaderboardCard) {
      const history = loadLocal(STORAGE_KEY_HISTORY, []);
      const matieres = Object.keys(QCM_DATA);

      leaderboardCard.innerHTML = `
        <div class="card-header">
          <div>
            <h2>Classement & comparaison</h2>
            <div class="text-muted">
              Moyenne par matière, rang (Fer → Élite global) et position par rapport aux autres utilisateurs.
            </div>
          </div>
        </div>
      `;

      if (history.length === 0) {
        const p = document.createElement("p");
        p.className = "text-muted mt-8";
        p.textContent = "Aucune épreuve enregistrée pour aucun utilisateur pour l’instant.";
        leaderboardCard.appendChild(p);
        return;
      }

      // Construire les moyennes par user et par matière
      const stats = {}; // { userName: { matiere: { sum, count } } }
      history.forEach(h => {
        if (!stats[h.user]) stats[h.user] = {};
        if (!stats[h.user][h.matiere]) stats[h.user][h.matiere] = { sum: 0, count: 0 };
        stats[h.user][h.matiere].sum += h.percent;
        stats[h.user][h.matiere].count += 1;
      });

      const sections = document.createElement("div");

      matieres.forEach(matiere => {
        // Liste des users qui ont au moins 1 épreuve dans cette matière
        const usersForMatiere = Object.keys(stats)
          .map(u => {
            const s = stats[u][matiere];
            if (!s || s.count === 0) return null;
            return { user: u, avg: s.sum / s.count };
          })
          .filter(Boolean)
          .sort((a,b) => b.avg - a.avg);

        if (usersForMatiere.length === 0) {
          return; // personne n’a encore joué cette matière
        }

        const currentEntry = usersForMatiere.find(e => e.user === user.name);
        const userHasData = !!currentEntry;

        const block = document.createElement("div");
        block.className = "mt-12";

        if (!userHasData) {
          block.innerHTML = `
            <h3>${matiere}</h3>
            <p class="text-muted">
              Tu n’as encore fait aucune épreuve dans cette matière. Les autres commencent déjà à scorer 😈
            </p>
          `;
          sections.appendChild(block);
          return;
        }

        const position = usersForMatiere.findIndex(e => e.user === user.name) + 1;
        const totalUsers = usersForMatiere.length;
        const avg = currentEntry.avg;
        const rankLabel = getRankLabel(avg);

        block.innerHTML = `
          <h3>${matiere}</h3>
          <div class="mt-4">
            <span class="tag">Moyenne : ${avg.toFixed(1)}%</span>
            <span class="tag">Rang : ${rankLabel}</span>
            <span class="tag">Position : ${position} / ${totalUsers}</span>
          </div>
          <div class="mt-4 text-muted">
            Top matière (utilisateurs triés par moyenne décroissante) :
          </div>
        `;

        const table = document.createElement("table");
        table.innerHTML = `
          <thead>
            <tr>
              <th>Utilisateur</th>
              <th>Moyenne %</th>
              <th>Rang</th>
            </tr>
          </thead>
          <tbody>
            ${usersForMatiere.map(e => `
              <tr>
                <td>${e.user === user.name ? "<strong>" + e.user + " (toi)</strong>" : e.user}</td>
                <td>${e.avg.toFixed(1)}%</td>
                <td>${getRankLabel(e.avg)}</td>
              </tr>
            `).join("")}
          </tbody>
        `;
        block.appendChild(table);
        sections.appendChild(block);
      });

      leaderboardCard.appendChild(sections);
    }

    // Lancement
    render();
  </script>
