<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>QCM Médicaux – Epreuves</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #1e293b 0, #020617 45%);
      color: #e5e7eb;
    }
    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }
    h1, h2, h3 { margin: 0 0 8px; }
    .card {
      background: #020617;
      border-radius: 18px;
      border: 1px solid #1f2937;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.6);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 999px;
      background: #0b1120;
      border: 1px solid #1f2937;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }
    input[type="text"], select, input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      font-size: 14px;
    }
    input[type="text"]:focus, select:focus, input[type="number"]:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 1px #4f46e5;
    }
    button {
      border-radius: 999px;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      background: #4f46e5;
      color: #e5e7eb;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button.secondary {
      background: #0b1120;
      border: 1px solid #374151;
    }
    button.danger {
      background: #b91c1c;
    }
    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .login-container {
      max-width: 380px;
      margin: 50px auto;
      text-align: center;
    }
    .login-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .login-sub {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 16px;
    }
    .flex {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .space-between { justify-content: space-between; }
    .mt-4 { margin-top: 4px; }
    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .mt-20 { margin-top: 20px; }
    .mt-24 { margin-top: 24px; }
    .qcm-question {
      margin-bottom: 16px;
      border-radius: 12px;
      border: 1px solid #111827;
      padding: 10px 12px;
      background: #020617;
    }
    .qcm-title {
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .qcm-options label {
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .qcm-options input[type="checkbox"] {
      margin: 4px 0;
    }
    .chip-score {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
      min-width: 60px;
      text-align: center;
    }
    .chip-score.full { border-color: #22c55e; }
    .chip-score.almost { border-color: #fbbf24; }
    .chip-score.low { border-color: #f97316; }
    .chip-score.zero { border-color: #ef4444; }
    .text-muted { color: #9ca3af; font-size: 12px; }
    .result-main {
      font-size: 18px;
      font-weight: 600;
    }
    .progress-bar {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #020617;
      border: 1px solid #111827;
      overflow: hidden;
    }
    .progress-bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,#4f46e5,#22c55e);
      transition: width 0.4s ease;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      border-bottom: 1px solid #111827;
      padding: 4px 6px;
      text-align: left;
    }
    th {
      font-weight: 600;
      color: #9ca3af;
    }
    .pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #0b1120;
      border: 1px solid #111827;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .advice-list {
      font-size: 13px;
    }
    .advice-list li { margin-bottom: 4px; }

    .mode-pill {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
      font-size: 12px;
      cursor: pointer;
    }
    .mode-pill.active {
      border-color: #4f46e5;
      background: #111827;
    }

    .rank-icon {
      font-size: 16px;
      margin-right: 4px;
    }
    .rank-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .card-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /**********************
     * SUPABASE – CONFIG
     *********************/
    const SUPABASE_URL = "https://hgzjrzucvrrakpltpiuu.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnempyenVjdnJyYWtwbHRwaXV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMyNDIwMjgsImV4cCI6MjA3ODgxODAyOH0.1X-ZSpqYHp-k54VJjtQtBr6yCcMbOnrh6yCdgS2fKqo";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function saveScoreToSupabase(pseudo, matiere, score, total, percent) {
      try {
        const { error } = await supabaseClient
          .from("scores")
          .insert([{ pseudo, matiere, score, total, percent }]);
        if (error) console.error("Erreur Supabase insert:", error);
      } catch (e) {
        console.error("Exception Supabase insert:", e);
      }
    }

    async function fetchGlobalScoresFromSupabase() {
      try {
        const { data, error } = await supabaseClient
          .from("scores")
          .select("*")
          .order("percent", { ascending: false });
        if (error) {
          console.error("Erreur Supabase select:", error);
          return [];
        }
        return data || [];
      } catch (e) {
        console.error("Exception Supabase select:", e);
        return [];
      }
    }

    /**********************
     * STOCKAGE LOCAL
     *********************/
    const STORAGE_KEY_USER = "qcm_user_v1";
    const STORAGE_KEY_HISTORY = "qcm_history_v1";

    function saveLocal(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }
    function loadLocal(key, defaultValue) {
      const raw = localStorage.getItem(key);
      if (!raw) return defaultValue;
      try { return JSON.parse(raw); } catch { return defaultValue; }
    }

    const app = document.getElementById("app");

    /**********************
     * RANGS / CLASSEMENT
     *********************/
    function getRankInfo(percent) {
      if (percent >= 98) return { name: "Élite Global", icon: "👑" };
      if (percent >= 95) return { name: "Grand Champion", icon: "🏆" };
      if (percent >= 90) return { name: "Champion", icon: "🥇" };
      if (percent >= 80) return { name: "Platine", icon: "🔷" };
      if (percent >= 70) return { name: "Cristal", icon: "💠" };
      if (percent >= 60) return { name: "Or", icon: "🟡" };
      if (percent >= 45) return { name: "Bronze", icon: "🥉" };
      return { name: "Fer", icon: "🪨" };
    }

    function computeGlobalStats(rows) {
      const perUser = new Map();
      rows.forEach(r => {
        const pseudo = r.pseudo || "Inconnu";
        if (!perUser.has(pseudo)) perUser.set(pseudo, []);
        perUser.get(pseudo).push(r.percent);
      });
      const ranking = [];
      perUser.forEach((list, pseudo) => {
        const avg = list.reduce((a, b) => a + b, 0) / list.length;
        ranking.push({ pseudo, avg, rankInfo: getRankInfo(avg) });
      });
      ranking.sort((a, b) => b.avg - a.avg);
      return ranking;
    }

    /**********************
     * BARÈME
     *********************/
    // 0 faute -> 1 ; 1 faute -> 0,5 ; 2 fautes -> 0,2 ; ≥3 fautes -> 0
    function gradeQuestion(question, selected) {
      const correct = new Set(question.correct);
      const chosen = new Set(selected);
      let errors = 0;

      chosen.forEach(c => {
        if (!correct.has(c)) errors++;
      });
      correct.forEach(c => {
        if (!chosen.has(c)) errors++;
      });

      let score = 0;
      if (errors === 0) score = 1;
      else if (errors === 1) score = 0.5;
      else if (errors === 2) score = 0.2;
      else score = 0;

      let comment = "";
      if (errors === 0) comment = "✅ Parfait — aucune erreur.";
      else if (errors === 1) comment = "🟡 1 erreur — presque.";
      else if (errors === 2) comment = "🟠 2 erreurs — fragile.";
      else comment = "🔴 3+ erreurs — revoir ce point.";

      return { score, errors, comment };
    }

    function pickRandomQuestions(pool, n) {
      const arr = [...pool];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr.slice(0, Math.min(n, arr.length));
    }

    /**********************
     * LOGIN
     *********************/
    function renderLogin() {
      app.innerHTML = "";

      const box = document.createElement("div");
      box.className = "login-container card";
      box.innerHTML = `
        <div class="login-title">QCM Médicaux – Connexion</div>
        <div class="login-sub">Crée ton pseudo pour le classement mondial (Supabase).</div>
        <label for="pseudo">Pseudo</label>
        <input type="text" id="pseudo" placeholder="Ex : Nes, Co-D1, Léo..." />
        <button id="login-btn" class="mt-12">Entrer</button>
      `;
      app.appendChild(box);

      const input = box.querySelector("#pseudo");
      const btn = box.querySelector("#login-btn");

      btn.onclick = () => {
        const p = (input.value || "").trim();
        if (!p) {
          alert("Entre un pseudo.");
          return;
        }
        saveLocal(STORAGE_KEY_USER, { name: p });
        render();
      };

      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") btn.click();
      });
    }

    /**********************
     * PAGE PRINCIPALE
     *********************/
    function renderMain(user) {
      app.innerHTML = "";

      const header = document.createElement("div");
      header.className = "card";
      header.innerHTML = `
        <div class="card-header">
          <div>
            <h1>Bonjour ${user.name} 👋</h1>
            <div class="text-muted">
              Mode épreuve : choisis matière / chapitre, lance tes QCM. Scores locaux + classement global.
            </div>
          </div>
          <button id="logout" class="secondary">Changer d'utilisateur</button>
        </div>
      `;
      app.appendChild(header);

      header.querySelector("#logout").onclick = () => {
        saveLocal(STORAGE_KEY_USER, null);
        render();
      };

      const selectorCard = document.createElement("div");
      selectorCard.className = "card";

      const matieres = Object.keys(QCM_DATA);
      const defaultMatiere = matieres[0];

      selectorCard.innerHTML = `
        <div class="card-header">
          <div>
            <h2>Paramètres de l'épreuve</h2>
            <div class="text-muted">
              Mode chapitre (QCM d'un chapitre) ou épreuve matière (chapitres mélangés).
            </div>
          </div>
          <span class="badge">Mode EDN</span>
        </div>

        <div class="mt-8">
          <label for="select-matiere">Matière</label>
          <select id="select-matiere"></select>
        </div>

        <div class="mt-8">
          <label for="select-chapitre">Chapitre</label>
          <select id="select-chapitre"></select>
        </div>

        <div class="mt-8 flex">
          <div id="mode-chapitre" class="mode-pill active" data-mode="chapitre">Mode chapitre</div>
          <div id="mode-matiere" class="mode-pill" data-mode="matiere">Mode matière</div>
        </div>

        <div class="mt-12 flex space-between">
          <div style="flex:1; max-width:180px;">
            <label for="nb-qcm">Nombre de QCM</label>
            <input type="number" id="nb-qcm" min="1" max="50" value="20" />
          </div>
          <div class="mt-8">
            <span class="pill" id="infos-qcm"></span>
          </div>
        </div>

        <div class="mt-16 flex space-between">
          <button id="btn-start">Lancer l'épreuve</button>
          <button class="secondary" id="btn-clear-user">Effacer mon historique local</button>
        </div>
      `;
      app.appendChild(selectorCard);

      const selectMatiere = selectorCard.querySelector("#select-matiere");
      const selectChapitre = selectorCard.querySelector("#select-chapitre");
      const modeChapitrePill = selectorCard.querySelector("#mode-chapitre");
      const modeMatierePill = selectorCard.querySelector("#mode-matiere");
      const nbQcmInput = selectorCard.querySelector("#nb-qcm");
      const infosQcmSpan = selectorCard.querySelector("#infos-qcm");
      const btnStart = selectorCard.querySelector("#btn-start");
      const btnClearUser = selectorCard.querySelector("#btn-clear-user");

      matieres.forEach((m) => {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = m;
        selectMatiere.appendChild(opt);
      });
      selectMatiere.value = defaultMatiere;

      function updateChapitres() {
        selectChapitre.innerHTML = "";
        const matiere = selectMatiere.value;
        const chapList = Object.keys(QCM_DATA[matiere]);
        chapList.forEach((c) => {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          selectChapitre.appendChild(opt);
        });
        selectChapitre.value = chapList[0];
      }

      updateChapitres();

      let currentMode = "chapitre";

      function updateMode(mode) {
        currentMode = mode;
        if (mode === "chapitre") {
          modeChapitrePill.classList.add("active");
          modeMatierePill.classList.remove("active");
        } else {
          modeMatierePill.classList.add("active");
          modeChapitrePill.classList.remove("active");
        }
        updateInfoQcm();
      }

      function getAvailableQuestions() {
        const matiere = selectMatiere.value;
        const chapitre = selectChapitre.value;
        if (currentMode === "chapitre") {
          return QCM_DATA[matiere][chapitre] || [];
        } else {
          const all = [];
          const map = QCM_DATA[matiere];
          Object.keys(map).forEach(ch => {
            all.push(...map[ch]);
          });
          return all;
        }
      }

      function updateInfoQcm() {
        const list = getAvailableQuestions();
        const n = list.length;
        const bar = "Barème : 0 faute = 1 ; 1 = 0,5 ; 2 = 0,2 ; ≥3 = 0";
        infosQcmSpan.textContent = `${n} QCM dispo · ${bar}`;
      }

      modeChapitrePill.onclick = () => updateMode("chapitre");
      modeMatierePill.onclick = () => updateMode("matiere");

      selectMatiere.onchange = () => {
        updateChapitres();
        updateInfoQcm();
      };
      selectChapitre.onchange = updateInfoQcm;
      nbQcmInput.onchange = () => {
        let v = parseInt(nbQcmInput.value || "20", 10);
        if (v < 1) v = 1;
        if (v > 50) v = 50;
        nbQcmInput.value = v;
      };

      btnClearUser.onclick = () => {
        if (!confirm("Supprimer tout ton historique local ?")) return;
        const history = loadLocal(STORAGE_KEY_HISTORY, []);
        const filtered = history.filter(h => h.user !== user.name);
        saveLocal(STORAGE_KEY_HISTORY, filtered);
        alert("Historique local effacé.");
        render();
      };

      const examCard = document.createElement("div");
      examCard.className = "card";
      examCard.id = "exam-card";
      app.appendChild(examCard);

      const historyCard = document.createElement("div");
      historyCard.className = "card";
      historyCard.id = "history-card";
      app.appendChild(historyCard);

      btnStart.onclick = () => {
        const pool = getAvailableQuestions();
        if (!pool.length) {
          alert("Pas encore de QCM dans ce dossier.");
          return;
        }
        const n = parseInt(nbQcmInput.value || "20", 10);
        const selected = pickRandomQuestions(pool, n);
        renderExam(user, selected, {
          matiere: selectMatiere.value,
          chapitre: selectChapitre.value,
          mode: currentMode
        }, examCard, historyCard);
      };

      updateInfoQcm();
      renderHistory(user, historyCard);
    }

    /**********************
     * EPREUVE
     *********************/
    function renderExam(user, questions, meta, examCard, historyCard) {
      examCard.innerHTML = `
        <div class="card-header">
          <div>
            <h2>Epreuve – ${meta.mode === "chapitre" ? meta.chapitre : meta.matiere}</h2>
            <div class="text-muted">
              Mode : ${meta.mode === "chapitre" ? "Chapitre" : "Matière (chapitres mélangés)"} · ${questions.length} QCM
            </div>
          </div>
          <span class="badge">En cours</span>
        </div>
      `;

      const form = document.createElement("div");
      form.id = "exam-form";

      questions.forEach((q, idx) => {
        const qDiv = document.createElement("div");
        qDiv.className = "qcm-question";
        qDiv.dataset.qid = q.id;

        let optionsHtml = "";
        Object.entries(q.options).forEach(([letter, text]) => {
          optionsHtml += `
            <label>
              <input type="checkbox" name="${q.id}" value="${letter}" />
              <span><strong>${letter}.</strong> ${text}</span>
            </label>
          `;
        });

        qDiv.innerHTML = `
          <div class="flex space-between">
            <div class="qcm-title">${idx + 1}. ${q.question}</div>
            <div class="chip-score" id="score-${q.id}">– / 1</div>
          </div>
          <div class="text-muted">
            Matière : ${meta.matiere} · Chapitre : ${q.chapter || meta.chapitre} · Thème : ${q.theme}
          </div>
          <div class="qcm-options mt-8">
            ${optionsHtml}
          </div>
          <div class="text-muted mt-8" id="feedback-${q.id}"></div>
        `;
        form.appendChild(qDiv);
      });

      const actions = document.createElement("div");
      actions.className = "mt-16 flex space-between";
      actions.innerHTML = `
        <button id="btn-corriger">Corriger l'épreuve</button>
        <button id="btn-reset" class="secondary">Effacer toutes les réponses</button>
      `;

      examCard.appendChild(form);
      examCard.appendChild(actions);

      examCard.querySelector("#btn-corriger").onclick = () => {
        corrigerEpreuve(user, questions, meta, examCard, historyCard);
      };

      examCard.querySelector("#btn-reset").onclick = () => {
        const cbs = examCard.querySelectorAll("input[type='checkbox']");
        cbs.forEach(cb => cb.checked = false);
        questions.forEach(q => {
          const s = document.getElementById(`score-${q.id}`);
          const f = document.getElementById(`feedback-${q.id}`);
          if (s) {
            s.textContent = "– / 1";
            s.className = "chip-score";
          }
          if (f) f.textContent = "";
        });
      };
    }

    async function corrigerEpreuve(user, questions, meta, examCard, historyCard) {
      let totalScore = 0;
      const totalMax = questions.length;
      const perQuestion = [];

      questions.forEach((q) => {
        const checked = examCard.querySelectorAll(`input[name='${q.id}']:checked`);
        const selected = Array.from(checked).map(cb => cb.value);
        const { score, errors, comment } = gradeQuestion(q, selected);

        totalScore += score;
        perQuestion.push({
          id: q.id,
          question: q.question,
          score,
          errorsCount: errors,
          theme: q.theme,
          chapter: q.chapter,
          advice: q.advice
        });

        const chip = document.getElementById(`score-${q.id}`);
        const fb = document.getElementById(`feedback-${q.id}`);
        if (chip) {
          chip.textContent = `${score.toFixed(1)} / 1`;
          chip.className = "chip-score " + (
            score === 1 ? "full" :
            score === 0.5 ? "almost" :
            score === 0.2 ? "low" : "zero"
          );
        }
        if (fb) {
          fb.innerHTML = `
            ${comment}<br/>
            <span class="text-muted">Correction attendue : ${q.correct.join(", ")}</span>
          `;
        }
      });

      const percent = totalMax ? (100 * totalScore / totalMax) : 0;
      const percentRounded = Math.round(percent);

      // Historique local
      const history = loadLocal(STORAGE_KEY_HISTORY, []);
      history.push({
        user: user.name,
        date: new Date().toISOString(),
        matiere: meta.matiere,
        chapitre: meta.mode === "chapitre" ? meta.chapitre : "Epreuve matière",
        mode: meta.mode,
        totalScore,
        totalMax,
        percent: percentRounded,
        perQuestion
      });
      saveLocal(STORAGE_KEY_HISTORY, history);

      // Enregistrement global (Supabase)
      await saveScoreToSupabase(user.name, meta.matiere, totalScore, totalMax, percentRounded);

      renderResultCard(user, meta, totalScore, totalMax, percent, perQuestion, examCard);
      renderHistory(user, historyCard);
    }

    function renderResultCard(user, meta, totalScore, totalMax, percent, perQuestion, examCard) {
      let card = document.getElementById("result-card");
      if (!card) {
        card = document.createElement("div");
        card.id = "result-card";
        card.className = "card mt-16";
        examCard.parentNode.insertBefore(card, examCard.nextSibling);
      }

      const toReview = perQuestion.filter(q => q.score < 1);
      const themes = new Map();
      toReview.forEach(q => {
        if (!themes.has(q.theme)) {
          themes.set(q.theme, q.advice || q.theme);
        }
      });

      let adviceHtml = "";
      if (toReview.length === 0) {
        adviceHtml = `<p class="text-muted">Rien de particulier à revoir sur cette épreuve, c'est propre 👌</p>`;
      } else {
        adviceHtml = `<ul class="advice-list">`;
        themes.forEach((text, theme) => {
          adviceHtml += `<li><strong>${theme} :</strong> ${text}</li>`;
        });
        adviceHtml += `</ul>`;
      }

      // Rang moyen (local) dans la matière
      const history = loadLocal(STORAGE_KEY_HISTORY, []);
      const same = history.filter(h => h.user === user.name && h.matiere === meta.matiere);
      let avgMatiere = percent;
      if (same.length > 0) {
        const sum = same.reduce((a, h) => a + h.percent, 0);
        avgMatiere = sum / same.length;
      }
      const rankInfo = getRankInfo(avgMatiere);

      card.innerHTML = `
        <div class="card-header">
          <div>
            <h2>Résultats – ${meta.mode === "chapitre" ? meta.chapitre : meta.matiere}</h2>
            <div class="text-muted">
              Mode : ${meta.mode === "chapitre" ? "Chapitre" : "Matière (chapitres mélangés)"}
            </div>
          </div>
          <div class="result-main">
            ${totalScore.toFixed(1)} / ${totalMax} (${percent.toFixed(0)}%)
          </div>
        </div>
        <div class="mt-8">
          <div class="progress-bar">
            <div class="progress-bar-inner" style="width:${percent}%;"></div>
          </div>
        </div>
        <div class="mt-12">
          <div class="text-muted">Ton rang moyen dans ${meta.matiere} (local) :</div>
          <p class="rank-badge">
            <span class="rank-icon">${rankInfo.icon}</span>
            <span>${rankInfo.name}</span> · ${avgMatiere.toFixed(0)}%
          </p>
        </div>
        <div class="mt-12">
          <div class="text-muted">Conseils de révision ciblée :</div>
          ${adviceHtml}
        </div>
      `;
    }

    /**********************
     * HISTORIQUE + CLASSEMENT GLOBAL
     *********************/
    async function renderHistory(user, historyCard) {
      const history = loadLocal(STORAGE_KEY_HISTORY, []);
      const userHistory = history.filter(h => h.user === user.name);

      historyCard.innerHTML = `
        <div class="card-header">
          <div>
            <h2>Historique & Classement</h2>
            <div class="text-muted">
              Historique local + classement global (tous appareils, via Supabase).
            </div>
          </div>
        </div>
      `;

      // Historique local
      if (!userHistory.length) {
        const p = document.createElement("p");
        p.className = "text-muted mt-8";
        p.textContent = "Aucune épreuve locale enregistrée pour l'instant.";
        historyCard.appendChild(p);
      } else {
        userHistory.sort((a, b) => new Date(b.date) - new Date(a.date));
        const table = document.createElement("table");
        table.innerHTML = `
          <thead>
            <tr>
              <th>Date</th>
              <th>Matière</th>
              <th>Chapitre / Mode</th>
              <th>Score</th>
              <th>%</th>
              <th>Q à revoir</th>
            </tr>
          </thead>
          <tbody>
            ${
              userHistory.map(h => {
                const d = new Date(h.date);
                const label = d.toLocaleString("fr-FR", {
                  day: "2-digit",
                  month: "2-digit",
                  hour: "2-digit",
                  minute: "2-digit"
                });
                const toRev = h.perQuestion.filter(q => q.score < 1).length;
                return `
                  <tr>
                    <td>${label}</td>
                    <td>${h.matiere}</td>
                    <td>${h.chapitre}</td>
                    <td>${h.totalScore.toFixed(1)} / ${h.totalMax}</td>
                    <td>${h.percent}%</td>
                    <td>${toRev}</td>
                  </tr>
                `;
              }).join("")
            }
          </tbody>
        `;
        historyCard.appendChild(table);
      }

      // Classement global Supabase
      const globalDiv = document.createElement("div");
      globalDiv.className = "mt-16";
      globalDiv.innerHTML = `
        <div class="text-muted">Classement global (tous utilisateurs / tous appareils) :</div>
        <p class="text-muted" id="global-loading">Chargement...</p>
      `;
      historyCard.appendChild(globalDiv);

      const rows = await fetchGlobalScoresFromSupabase();
      const loading = globalDiv.querySelector("#global-loading");

      if (!rows.length) {
        loading.textContent = "Aucun score global enregistré pour l'instant.";
        return;
      }

      loading.remove();
      const ranking = computeGlobalStats(rows);

      const table2 = document.createElement("table");
      table2.className = "mt-8";
      table2.innerHTML = `
        <thead>
          <tr>
            <th>Classement</th>
            <th>Utilisateur</th>
            <th>Moyenne globale</th>
            <th>Rang</th>
          </tr>
        </thead>
        <tbody>
          ${
            ranking.map((r, index) => `
              <tr>
                <td>${index + 1}</td>
                <td>${r.pseudo}</td>
                <td>${r.avg.toFixed(0)}%</td>
                <td>
                  <span class="rank-badge">
                    <span class="rank-icon">${r.rankInfo.icon}</span>
                    <span>${r.rankInfo.name}</span>
                  </span>
                </td>
              </tr>
            `).join("")
          }
        </tbody>
      `;
      globalDiv.appendChild(table2);
    }
